name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Prepare static export
        run: node scripts/prepare-github-pages.mjs

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_BASE_PATH: /gadget-center
          NEXT_PUBLIC_APP_URL: https://yogipowar.github.io/gadget-center
          NEXT_PUBLIC_SITE_NAME: GadgetCenter
          NEXT_PUBLIC_WHATSAPP_NUMBER: "918530613876"
          NEXT_PUBLIC_PHONE_ORDERS: "8530613876"
          NEXT_PUBLIC_PHONE_REPAIR: "8530613876"
          NEXT_PUBLIC_CONTACT_EMAIL: info@scrollosoft.com
          NEXT_PUBLIC_BUSINESS_ADDRESS: Jyotirling Colony, Bondre Nagar, Phulewadi, Kolhapur, Maharashtra 416010

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
